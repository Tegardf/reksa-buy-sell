services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reksa
      POSTGRES_PASSWORD: reksa
      POSTGRES_DB: reksa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reksa"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

volumes:
  pgdata: